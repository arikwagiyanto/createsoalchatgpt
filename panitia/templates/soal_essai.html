{% extends 'base_user.html' %}

{% block content %}
  <!DOCTYPE html>
  <html>
    <head>
      <title>Input Soal Esai</title>
      <style>
        /* The Modal (background) */
        .modal {
          display: none;
          position: fixed;
          z-index: 1;
          padding-top: 100px;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          overflow: auto;
          background-color: rgb(0, 0, 0);
          background-color: rgba(0, 0, 0, 0.4);
        }

        /* Modal Content */
        .modal-content {
          background-color: #fefefe;
          margin: auto;
          padding: 20px;
          border: 1px solid #888;
          width: 80%;
          max-width: 500px;
        }

        /* The Close Button */
        .close {
          color: #aaa;
          float: right;
          font-size: 28px;
          font-weight: bold;
        }

        .close:hover,
        .close:focus {
          color: black;
          text-decoration: none;
          cursor: pointer;
        }

        /* Floating button styles */
        .floating-btn {
          position: fixed;
          right: 20px;
          bottom: 20px;
          z-index: 1000;
          background-color: #007bff;
          color: white;
          padding: 15px 20px;
          border: none;
          border-radius: 50px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          font-size: 16px;
          transition: all 0.3s ease;
        }

        .floating-btn:hover {
          background-color: #0056b3;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
          transform: translateY(-2px);
        }
      </style>
    </head>
    <body>
      <div class="main-content">
        <section class="section">
          <div class="section-body">
            <div class="row justify-content-center">
              <div class="col-md-8">
                <div class="card">
                  <div class="card-header">
                    <h3>Mata Pelajaran : {{ mapel }}</h3>
                  </div>
                  <div class="card-body">
                    <h4>Soal Nomor {{ nomor_soal }}</h4>
                    <hr />
                    <form method="post">
                      {% csrf_token %}
                      {{ form.as_p }}
                      <button type="submit" class="btn btn-primary">Simpan</button>
                      <a href="{% url 'buatsoal_panitia' %}" class="btn btn-success">Cancel</a>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Floating button -->
      <button id="openModalBtn" class="btn btn-primary floating-btn"><i data-feather="feather"></i> ChatGPT</button>

      <!-- The Modal -->
      <div id="myModal" class="modal">
        <!-- Modal content -->
        <div class="modal-content">
          <span class="close">&times;</span>
          <h6>Generate Soal dengan ChatGPT</h6>
          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="chatgpt_prompt">Masukkan Prompt:</label>
              <textarea name="chatgpt_prompt" id="chatgpt_prompt" class="form-control"></textarea>
            </div>
            <button type="submit" name="generate_from_chatgpt" class="btn btn-primary">Generate Soal</button>
          </form>
        </div>
      </div>
      

      <script>
        // Get the modal
        var modal = document.getElementById('myModal')

        // Get the button that opens the modal
        var btn = document.getElementById('openModalBtn')

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName('close')[0]

        // When the user clicks the button, open the modal
        btn.onclick = function () {
          modal.style.display = 'block'
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function () {
          modal.style.display = 'none'
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function (event) {
          if (event.target == modal) {
            modal.style.display = 'none'
          }
        }
      </script>
    </body>
  </html>
{% endblock %}
